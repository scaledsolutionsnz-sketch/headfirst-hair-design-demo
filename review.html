<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leave a Review | Headfirst Hair Design</title>
<meta name="description" content="Tell us how your visit to Headfirst Hair Design went." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231d1719'/%3E%3Ctext x='50' y='70' font-family='Arial,sans-serif' font-size='58' font-weight='bold' text-anchor='middle' fill='%23e1496a'%3EH%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<nav class="nav scrolled">
  <a href="index.html" class="nav__brand">Headfirst Hair<span class="dot">.</span></a>
  <div class="nav__links">
    <a href="index.html#services">Services</a>
    <a href="index.html#about">About</a>
    <a href="index.html#reviews">Reviews</a>
    <a href="tel:+6433497544" class="nav__phone">03 349 7544</a>
    <a href="index.html#contact" class="btn btn--primary nav__cta">Book Now</a>
  </div>
</nav>

<main class="review-wrap">
  <div class="review-card">
    <span class="eyebrow" style="justify-content:center;display:flex;">Your feedback</span>
    <h1 style="margin-top:14px;">How was your visit?</h1>
    <p>Tap a star to let us know how we did at Headfirst Hair Design.</p>
    <div class="star-pick" id="stars">
      <button data-rating="5" aria-label="5 stars">★</button>
      <button data-rating="4" aria-label="4 stars">★</button>
      <button data-rating="3" aria-label="3 stars">★</button>
      <button data-rating="2" aria-label="2 stars">★</button>
      <button data-rating="1" aria-label="1 star">★</button>
    </div>
    <p class="review-hint">5 stars sends you to Google · anything less comes straight to us privately.</p>
  </div>
</main>

<script>
  // 4-5 stars -> Google review. 1-3 stars -> private feedback page.
  var GOOGLE_REVIEW_URL = "https://g.page/r/PLACEHOLDER";
  document.getElementById("stars").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-rating]");
    if (!btn) return;
    var rating = parseInt(btn.getAttribute("data-rating"), 10);
    // light up
    var all = this.querySelectorAll("button");
    all.forEach(function (b) { b.classList.remove("lit"); });
    btn.classList.add("lit");
    setTimeout(function () {
      if (rating >= 4) {
        window.location.href = GOOGLE_REVIEW_URL;
      } else {
        window.location.href = "private.html?rating=" + rating;
      }
    }, 280);
  });
</script>
</body>
</html>
